，期待收到我们的邀请！\",\"affiliate_faq_answer_10\":\"当您推荐的用户中出现大量退款时，我们会冻结部分收益作为风险防控措施。冻结机制如下：\\n\\n- 退款率20%至\u003c30%：冻结您的可提现收益 + 20%的在途收益\\n- 退款率30%至\u003c50%：冻结您的可提现收益 + 50%的在途收益\\n- 退款率≥50%：冻结全部可提现和在途收益\\n\\n冻结触发后，您将进入30天观察期。如果观察期内日均退款率保持在10%以下，我们将每7天解冻25%的收益。如果退款率超过10%，观察期计时器将重置。\",\"affiliate_faq_answer_11\":\"当您推荐的用户出现退款或拒付情况时，我们会从您的佣金中扣除相应金额。如果您的可提现余额不足以覆盖这些扣除额，您的收益将显示为负数，直到未来的佣金弥补这一差额。\",\"affiliate_faq_answer_12\":\"我们的联盟计划目前仅专注于产品销售。我们不提供多层级的佣金系统，因此您无法从您推荐的其他联盟会员的销售中获得佣金。不过，请持续关注我们未来可能推出的计划更新！\",\"affiliate_faq_answer_13\":\"我们禁止使用垃圾邮件、误导性广告以及任何违反我们条款和条件的方法。任何可能损害海螺AI声誉的推广活动也严格禁止。我们希望我们的联盟会员始终保持道德营销实践。\",\"affiliate_faq_answer_14\":\"不可以，创建可能被误认为是海螺AI官方网站或账号的网站或社交媒体资料是严格禁止的。您的推广材料应清楚表明您是联盟合作伙伴，而非海螺AI的官方代表。\",\"affiliate_faq_answer_15\":\"违反我们的推广指南可能导致您的联盟账户被暂停或终止。此外，我们保留扣留通过禁止推广方式获得的任何佣金的权利。我们严肃对待联盟计划的诚信问题，以维护与客户的信任关系。\",\"affiliate_faq_answer_2\":\"个人、博主、社交媒体influencer、网站所有者和企业均可申请，前提是满足以下条件：\\n  - 遵守我们平台的服务条款和推广政策\\n  - 不推广非法、侵权或成人内容\\n  - 遵守您所在国家和推广地区的法律法规\",\"affiliate_faq_answer_3\":\"您的收入潜力没有上限！对于您推荐给我们Standard、Pro和Unlimited计划的任何付费用户，您将获得他们首月订阅费用的10%作为佣金。推广越多，收益越高。\\n\\n举例：如果您推荐了10位Pro月度用户和20位Unlimited年度用户，您将获得：\\n(10×$34.99 + 20×$1139.88) × 95% × 10% = $2,199\\n\\n- $34.99为Pro月度计划价格，$1139.88为Unlimited年度计划价格\\n- 95%代表受邀用户在享受5%折扣后的实际支付金额\\n- 10%是您的佣金比例\",\"affiliate_faq_answer_4\":\"我们的佣金结构旨在让联盟会员和新客户都受益：\\n- 您获得通过您的推荐链接产生的每笔订阅的10%佣金\\n- 通过您的链接注册的新用户在首次订购时享受5%的折扣\\n- 佣金基于受邀客户支付的折扣后金额计算\",\"affiliate_faq_answer_5\":\"您可以在联盟计划页面实时跟踪您的收益。佣金在受邀客户付款30天后才可提现。例如，如果客户在3月1日购买订阅，该笔佣金将记为在途收益，并于4月1日变为可提现状态。\\n\\n对于年度订阅，我们分期发放佣金。在前6个月，您每月将获得总佣金的1/12，第7个月将一次性获得剩余的6/12佣金。例如，如果您从年度订阅中获得$120的佣金，前六个月您每月将收到$10，第七个月将一次性收到$60。\",\"affiliate_faq_answer_6\":\"您可以邀请以下用户：\\n- 尚未订阅我们任何付费计划的用户\\n- 尚未被其他联盟会员推荐的用户\",\"affiliate_faq_answer_7\":\"您的推荐链接Cookie有效期为7天。这意味着，如果用户点击您的链接并在7天内完成购买，您将获得相应的销售佣金。\",\"affiliate_faq_answer_8\":\"不可以，联盟计划会员不能从自己的购买中获得佣金。联盟计划旨在奖励您带来新客户。\",\"affiliate_faq_answer_9\":\"如果您推荐的客户申请退款，相关佣金将不予支付或从您未来的收益中扣除。如果您的推荐用户出现较高的退款率，我们可能会暂时冻结部分收益，直至退款率恢复正常。对于疑似欺诈活动的情况，我
